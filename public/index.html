<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#feee66">
<title>VamosRapido Recompensas</title>
<style>
:root{--y:#feee66;--k:#111;--bg:#fff;--card:#f7f5e6;--tx:#111;--mu:#6b6b6b;--bd:#e6e2c6}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#222;--tx:#f5f5f5;--mu:#aaa;--bd:#383838}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--y);display:flex;justify-content:center;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0)}
header img{height:64px;max-width:100%;object-fit:contain}
#app{max-width:560px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
.hero{background:var(--k);color:var(--y);border-radius:20px;padding:20px;margin:0 0 12px}
.pts{font-size:56px;font-weight:800;line-height:1}.pts span{font-size:20px}
.mu{color:var(--mu)}.c{text-align:center}code{word-break:break-all;font-size:12px}
h3{margin:18px 0 8px}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}
input:focus-visible,button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.b{background:var(--k);color:var(--y);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;width:100%;margin-top:6px;cursor:pointer}
.b.y{background:var(--y);color:#111}.b.s{width:auto;padding:8px 12px;font-size:14px;margin:0}.b:disabled{opacity:.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{background:var(--y);color:#111;border-radius:8px;padding:2px 8px;font-weight:700;font-size:13px}
.cp{font:700 22px monospace;letter-spacing:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--k);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}
nav button{flex:1;background:none;border:0;color:#bbb;font:600 13px inherit;padding:10px 2px;border-radius:10px}
nav button.on{background:var(--y);color:#111}
#t{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
#qo{position:fixed;inset:0;background:#000;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
#qo video{width:100%;max-height:70%;object-fit:cover;border-radius:16px}#qo p{color:#fff;margin:0}
.qr{background:#fff;padding:8px;border-radius:12px;width:220px;max-width:100%;margin:10px auto}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head><body>
<header><img src="/logo.png" alt="VamosRapido"></header>
<div id="app"><p class="mu c">Cargando…</p></div><div id="t"></div><div id="nav"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o={})=>{const r=await fetch('/api'+p,{method:o.m||'GET',headers:o.b?{'Content-Type':'application/json'}:{},body:o.b?JSON.stringify(o.b):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Error'),{status:r.status});return d};
let me=null,view='',mode='in',cf=null;const D={};
const NOFC='Este celular no permite leer NFC desde la web. Usa el QR o la búsqueda.';
function toast(m){const t=$('#t');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,3200)}
function err(x){if(x.status===401&&me){me=null;render()}toast(x.message||'Error')}
const link=u=>location.origin+'/c/'+u;
const qrSvg=t=>{try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return''}};

async function init(){
 const p=new URLSearchParams(location.search);
 if(p.has('verified')){toast(p.get('verified')==='1'?'¡Email confirmado! Ya puedes ingresar':'El enlace no es válido o ya se usó');history.replaceState(null,'','/')}
 try{me=await api('/me')}catch(e){me=null}
 if(!me)return render();
 const m=location.pathname.match(/^\/c\/([a-z0-9_]+)/i);
 if(m)history.replaceState(null,'','/');
 if(me.user.role==='admin'&&m){view='caja';try{await pick(m[1])}catch(e){toast('Cliente no encontrado');await go('caja')}return}
 await go(me.user.role==='admin'?'caja':'home');
}
async function go(v){view=v;cf=null;
 try{
  if(v==='home'){D.h=(await api('/history')).rows;me=await api('/me')}
  if(v==='shop'){D.c=(await api('/catalog')).items;me=await api('/me')}
  if(v==='cps')D.k=(await api('/coupons')).rows;
  if(v==='caja'&&!D.sel)D.l=(await api('/users?q='+encodeURIComponent(D.q||''))).users;
  if(v==='adm'){D.c=(await api('/catalog')).items;me=await api('/me')}
 }catch(e){return err(e)}
 render()}
async function pick(u){if(!u){D.sel=null;return go('caja')}D.sel=await api('/users/'+encodeURIComponent(u));view='caja';render()}
async function pickFrom(t){const m=t.match(/\/c\/([a-z0-9_]+)/i)||t.match(/^(?:VR:)?([a-z0-9_]{3,20})$/i);
 if(!m)return false;try{await pick(m[1].toLowerCase());return true}catch(e){return false}}

function render(){
 const a=$('#app'),n=$('#nav');
 if(!me){n.innerHTML='';a.innerHTML=D.sent?sentHTML():authHTML();return}
 const adm=me.user.role==='admin',T=adm?[['caja','Caja'],['adm','Admin']]:[['home','Inicio'],['shop','Tienda'],['cps','Cupones']];
 if(!T.some(x=>x[0]===view))view=T[0][0];
 n.innerHTML='<nav>'+T.map(x=>`<button class="${x[0]===view?'on':''}" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('')+'</nav>';
 a.innerHTML=`<div class="row" style="margin-bottom:10px"><small class="mu">${adm?'Administrador · ':''}${esc(me.user.display)}</small><button class="b s" data-a="out">Salir</button></div>`+V[view]();
}
const authHTML=()=>{const up=mode==='up';return`<div class="card"><div class="row"><button class="b s ${up?'':'y'}" data-a="mode" data-m="in">Ingresar</button><button class="b s ${up?'y':''}" data-a="mode" data-m="up">Registrarme</button></div>
 <input id="us" placeholder="Usuario" autocapitalize="none" autocomplete="username">${up?'<input id="em" type="email" placeholder="Email" autocomplete="email">':''}
 <input id="pw" type="password" placeholder="Contraseña${up?' (mínimo 8)':''}" autocomplete="${up?'new-password':'current-password'}">
 <button class="b" data-a="${up?'register':'login'}">${up?'Crear cuenta':'Entrar'}</button></div>`};
const sentHTML=()=>`<div class="card c"><h3 style="margin-top:0">Revisa tu email</h3><p>Te enviamos un enlace de confirmación a <b>${esc(D.sent)}</b>. Ábrelo para activar tu cuenta.</p><button class="b" data-a="resend">Reenviar email</button><button class="b y" data-a="back">Ya confirmé, ingresar</button></div>`;
const list=()=>(D.l||[]).map(m=>`<div class="card row"><span>${esc(m.display)}<br><small class="mu">${esc(m.username)}</small></span><button class="b s" data-a="pick" data-u="${esc(m.username)}">Elegir</button></div>`).join('')||'<p class="mu">Sin resultados.</p>';
const V={
 home(){const u=me.user.username;return`<div class="hero"><div>Hola, ${esc(me.user.display)}</div><div class="pts">${me.balance}<span> puntos</span></div></div>
 <div class="card c"><b>Mi código QR</b><p class="mu" style="margin:4px 0">Muéstralo en caja para sumar puntos.</p><div class="qr">${qrSvg(link(u))}</div></div>
 <div class="card"><b>Mi llavero NFC</b><p class="mu">El llavero guarda este enlace. Al acercarlo a un celular, abre tu ficha en caja.</p><code>${esc(link(u))}</code><button class="b" data-a="write">Grabar llavero (Android)</button></div>
 <h3>Movimientos</h3>`+((D.h||[]).map(h=>`<div class="card row"><span>${esc(h.t)}<br><small class="mu">${new Date(h.ts).toLocaleDateString()}</small></span><b>${h.v}</b></div>`).join('')||'<p class="mu">Aún no tienes movimientos.</p>')},
 shop(){const b=me.balance;return`<div class="row"><h3 style="margin:0">Tienda</h3><span class="tag">${b} pts</span></div><p></p>`+((D.c||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="tag">${x.cost} pts</span></div><p class="mu" style="margin:6px 0">${esc(x.descr)}</p><button class="b ${cf===x.id?'y':''}" data-a="buy" data-id="${x.id}" ${b<x.cost?'disabled':''}>${b<x.cost?'Te faltan '+(x.cost-b)+' pts':cf===x.id?'¿Confirmar canje?':'Canjear'}</button></div>`).join('')||'<p class="mu">Todavía no hay premios disponibles.</p>')},
 cps(){return`<h3 style="margin-top:0">Mis cupones</h3>`+((D.k||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="tag">${x.used?'Usado':'Vigente'}</span></div><div class="cp" ${x.used?'style="opacity:.35"':''}>${esc(x.code)}</div><small class="mu">Muestra este código en caja</small></div>`).join('')||'<p class="mu">Aún no has canjeado nada.</p>')},
 caja(){const s=D.sel;
  if(!s)return`<h3 style="margin-top:0">Caja</h3><button class="b y" data-a="qr">📷 Escanear QR del cliente</button><button class="b" data-a="photo">📸 Tomar foto del QR</button><input id="qf" type="file" accept="image/*" capture="environment" hidden><button class="b" data-a="scan">📲 Leer llavero NFC</button>
  <h3>O busca un cliente</h3><input id="sq" placeholder="Nombre o usuario" autocapitalize="none" value="${esc(D.q||'')}"><div id="ml">${list()}</div>`;
  return`<button class="b s" data-a="pick" data-u="">← Cambiar cliente</button><div class="hero" style="margin-top:12px"><div>${esc(s.display)}</div><small>${esc(s.email)}</small><div class="pts">${s.balance}<span> pts</span></div></div>
  <div class="card"><b>Registrar compra</b><input id="am" type="number" inputmode="decimal" placeholder="Monto de la compra"><p class="mu" id="pv">1 punto por cada ${me.rate} de compra</p><button class="b" data-a="add">Sumar puntos</button></div>
  <h3>Cupones pendientes</h3>`+(s.coupons.map(x=>`<div class="card row"><span><b>${esc(x.name)}</b><br><span class="cp" style="font-size:18px">${esc(x.code)}</span></span><button class="b s" data-a="use" data-id="${x.id}">Marcar usado</button></div>`).join('')||'<p class="mu">Sin cupones pendientes.</p>')},
 adm(){return`<h3 style="margin-top:0">Configuración</h3><div class="card"><label>Monto por cada punto</label><input id="rt" type="number" value="${me.rate}"><button class="b" data-a="rate">Guardar</button></div>
  <h3>Nuevo premio o descuento</h3><div class="card"><input id="in" placeholder="Nombre (ej. 10% de descuento)"><input id="id" placeholder="Descripción"><input id="ic" type="number" placeholder="Costo en puntos"><button class="b" data-a="new">Publicar</button></div>
  <h3>Catálogo</h3>`+((D.c||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="tag">${x.cost} pts</span></div><div class="row" style="margin-top:8px"><button class="b s" data-a="tog" data-id="${x.id}" data-on="${x.active?'':'1'}">${x.active?'Pausar':'Activar'}</button><button class="b s" data-a="del" data-id="${x.id}">Eliminar</button></div></div>`).join('')||'<p class="mu">Catálogo vacío. Publica el primer premio.</p>')}
};
const val=s=>$(s).value.trim();
const A={
 mode(d){mode=d.m;render()},
 back(){D.sent=null;mode='in';render()},
 tab(d){go(d.v)},
 async register(){await api('/register',{m:'POST',b:{username:val('#us'),email:val('#em'),password:$('#pw').value}});D.sent=val('#em');render()},
 async resend(){await api('/resend',{m:'POST',b:{email:D.sent}});toast('Email reenviado')},
 async login(){await api('/login',{m:'POST',b:{username:val('#us'),password:$('#pw').value}});await init()},
 async out(){await api('/logout',{m:'POST'});me=null;D.sel=null;view='';render()},
 async write(){if(!('NDEFReader' in window))return toast('Para grabar el llavero usa un celular Android con Chrome, o la app NFC Tools con el enlace de arriba.');
  try{toast('Acerca el llavero…');await new NDEFReader().write({records:[{recordType:'url',data:link(me.user.username)}]});toast('Llavero grabado ✓')}catch(e){toast('No se pudo grabar: '+e.message)}},
 async buy(d){if(cf!==+d.id){cf=+d.id;return render()}cf=null;const r=await api('/redeem',{m:'POST',b:{itemId:+d.id}});toast('¡Canjeado! Tu código: '+r.code);await go('cps')},
 pick(d){return pick(d.u)},
 async add(){const a=+$('#am').value;const r=await api('/points',{m:'POST',b:{username:D.sel.username,amount:a}});toast('+'+r.pts+' puntos ✓');await pick(D.sel.username)},
 async use(d){await api('/coupons/'+d.id+'/use',{m:'POST'});await pick(D.sel.username)},
 async rate(){await api('/rate',{m:'PUT',b:{rate:+$('#rt').value}});me=await api('/me');toast('Guardado ✓')},
 async new(){await api('/catalog',{m:'POST',b:{name:val('#in'),descr:val('#id'),cost:+$('#ic').value}});toast('Publicado ✓');await go('adm')},
 async tog(d){await api('/catalog/'+d.id,{m:'PATCH',b:{active:!!d.on}});await go('adm')},
 async del(d){await api('/catalog/'+d.id,{m:'DELETE'});await go('adm')},
 photo(){$('#qf').click()},
 async scan(){
  if(!('NDEFReader' in window))return toast(NOFC);
  try{const r=new NDEFReader();await r.scan();toast('Acerca el llavero al celular…');
   r.onreading=async e=>{for(const x of e.message.records){if(x.recordType==='url'||x.recordType==='text'){if(await pickFrom(new TextDecoder(x.encoding||'utf-8').decode(x.data).trim()))return}}toast('Llavero no reconocido')}}
  catch(e){toast('No se pudo leer: '+e.message)}},
 async qr(){
  if(!navigator.mediaDevices)return toast('La cámara no está disponible. Usa "Tomar foto del QR".');
  let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('Permiso de cámara denegado. Usa "Tomar foto del QR".')}
  const o=document.createElement('div');o.id='qo';o.innerHTML='<video playsinline muted></video><p>Apunta al QR del cliente</p><button class="b y" id="qx" style="max-width:320px">Cerrar</button>';document.body.appendChild(o);
  const v=o.querySelector('video');v.srcObject=s;await v.play();
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});let on=true,bad='';
  const stop=()=>{on=false;s.getTracks().forEach(t=>t.stop());o.remove()};o.querySelector('#qx').onclick=stop;
  const tick=async()=>{if(!on)return;
   if(v.readyState>=2&&v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);
    const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
    if(r&&r.data!==bad){if(await pickFrom(r.data)){stop();return}bad=r.data;toast('QR no reconocido')}}
   setTimeout(tick,150)};tick()}
};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){b.disabled=b.tagName==='BUTTON'&&['login','register','add','buy'].includes(b.dataset.a);try{await A[b.dataset.a](b.dataset)}catch(x){err(x)}b.disabled=false}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!me&&e.target.tagName==='INPUT')$('[data-a=login],[data-a=register]')?.click()});
let sh;document.addEventListener('input',e=>{
 if(e.target.id==='sq'){D.q=e.target.value;clearTimeout(sh);sh=setTimeout(async()=>{try{D.l=(await api('/users?q='+encodeURIComponent(D.q))).users;$('#ml').innerHTML=list()}catch(x){err(x)}},250)}
 if(e.target.id==='am'){const p=Math.floor(+e.target.value/me.rate);$('#pv').textContent=p>0?'Sumará '+p+' puntos':'1 punto por cada '+me.rate+' de compra'}});
document.addEventListener('change',async e=>{
 if(e.target.id!=='qf'||!e.target.files[0])return;
 try{const img=await createImageBitmap(e.target.files[0]),sc=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
  const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
  if(!r)toast('No se encontró un QR en la foto. Acércate y reintenta');else if(!await pickFrom(r.data))toast('QR no reconocido')}
 catch(err){toast('No se pudo leer la foto')}
 e.target.value=''});
init();
</script></body></html>
